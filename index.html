<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>NYD Holdings</title>
<meta name="description" content="NYD Holdings. Just another holding company. Est. 2006.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script defer src="https://cloud.umami.is/script.js" data-website-id="80a0a434-1ed8-48ad-abfc-78bfafeb20f6"></script>
<style>
  :root{
    color-scheme: light dark;
    --bg:#ffffff;
    --fg:#161616;
    --fg-soft:#525252;
    --fg-muted:#a8a8a8;
    --line:#e0e0e0;
    --accent:#0f62fe;
    --accent-hover:#0043ce;
    --on-accent:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#161616;
      --fg:#f4f4f4;
      --fg-soft:#c6c6c6;
      --fg-muted:#6f6f6f;
      --line:#393939;
      --accent:#4589ff;
      --accent-hover:#78a9ff;
      --on-accent:#161616;
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'Poppins',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    min-height:100vh;
    max-width:960px;
    margin:0 auto;
    padding:40px 32px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  header{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .mark{
    width:14px;
    height:14px;
    background:var(--fg);
    flex:none;
  }
  .logo{
    font-weight:500;
    font-size:15px;
    letter-spacing:.2px;
  }
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:72px 0;
  }
  .rule{
    width:32px;
    height:2px;
    background:var(--fg);
    margin-bottom:24px;
    border:none;
  }
  h1{
    font-weight:400;
    font-size:clamp(28px,4.5vw,42px);
    line-height:1.3;
    max-width:9ch;
    margin:0 0 40px;
    letter-spacing:-.2px;
  }
  .cta{
    display:inline-flex;
    align-items:center;
    gap:10px;
    width:fit-content;
    background:var(--accent);
    color:var(--on-accent);
    font-family:'Poppins',sans-serif;
    font-weight:500;
    font-size:14px;
    padding:14px 20px;
    text-decoration:none;
    border:none;
    cursor:pointer;
    transition:background .15s ease;
  }
  .cta:hover{background:var(--accent-hover);}
  .cta svg{
    width:14px;
    height:14px;
    flex:none;
    transition:transform .15s ease;
  }
  .cta:hover svg{transform:translate(2px,-2px);}
  footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    font-weight:300;
    letter-spacing:1px;
    color:var(--fg-muted);
    border-top:1px solid var(--line);
    padding-top:16px;
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <span class="mark" aria-hidden="true"></span>
      <span class="logo">NYD Holdings</span>
    </header>

    <main>
      <hr class="rule">
      <h1>Just another holding company.</h1>
      <a class="cta"
         href="https://en.wikipedia.org/wiki/The_Last_Question"
         target="_blank"
         rel="noopener noreferrer">
        Sobre "The Last Question"
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12L12 4M12 4H5M12 4V11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </main>

    <footer>
      <span>© 2006–2026 NYD HOLDINGS</span>
      <span>EST. 2006</span>
    </footer>
  </div>
</body>
</html>
