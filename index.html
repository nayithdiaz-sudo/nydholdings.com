<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>NYD Holdings</title>
<meta name="description" content="NYD Holdings. Just another holding company. Est. 2006.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light dark;
    --bg:#ffffff;
    --fg:#161616;
    --fg-soft:#6f6f6f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#161616;
      --fg:#f4f4f4;
      --fg-soft:#a8a8a8;
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'Poppins',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  main{
    text-align:center;
    max-width:36ch;
  }
  h1{
    font-weight:500;
    font-size:clamp(22px,4vw,30px);
    letter-spacing:.2px;
    margin:0 0 12px;
  }
  p{
    font-weight:300;
    font-size:16px;
    color:var(--fg-soft);
    margin:0;
  }
  .est{
    display:block;
    margin-top:28px;
    font-weight:300;
    font-size:12px;
    letter-spacing:1px;
    color:var(--fg-soft);
  }
</style>
</head>
<body>
  <main>
    <h1>NYD Holdings</h1>
    <p>Just another holding company.</p>
    <span class="est">EST. 2006</span>
  </main>
</body>
</html>
